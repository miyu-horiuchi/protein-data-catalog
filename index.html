<div id="root"><div class="flex flex-col gap-6"><header class="inline-hidden flex items-start justify-between gap-4"><div class="flex flex-col gap-1"><h1 class="text-[20px] font-semibold text-text-primary">Public data for PPARγ, GCK, AURKA, and ERK2</h1><p class="text-[14px] text-text-secondary">Conformational measurements, matched controls, and individual downloads</p></div></header><section aria-label="Availability by target" class="space-y-3"><div class="border-b border-primary pb-3"><h2 class="text-lg font-semibold">PPARγ</h2><p class="text-sm">Apo LBD HDX-MS, inverse-agonist HDX-MS, SEC-SAXS for full-length and truncated constructs, and NMR assignments for isolated AB and ligand-bound LBD.</p><p class="text-sm text-secondary">Published apo ¹⁹F exchange at 1.0 s⁻¹. Raw CEST series was not located.</p><div class="mt-1 flex flex-wrap gap-x-4 gap-y-1 text-sm"><a target="_blank" rel="noopener noreferrer" class="text-text-link hover:text-text-link-strong hover:underline hover:decoration-dotted hover:decoration-text-link-strong underline-offset-2" data-streamdown="link" href="https://ftp.pride.ebi.ac.uk/pride/data/archive/2020/01/PXD016401/">Apo HDX files</a><a target="_blank" rel="noopener noreferrer" class="text-text-link hover:text-text-link-strong hover:underline hover:decoration-dotted hover:decoration-text-link-strong underline-offset-2" data-streamdown="link" href="https://ftp.pride.ebi.ac.uk/pride/data/archive/2025/11/PXD066095/">Inverse-agonist HDX files</a><a target="_blank" rel="noopener noreferrer" class="text-text-link hover:text-text-link-strong hover:underline hover:decoration-dotted hover:decoration-text-link-strong underline-offset-2" data-streamdown="link" href="https://www.sasbdb.org/media/intensities_files/SASDWX3.dat">Full-length SAXS .dat</a></div></div><div class="border-b border-primary pb-3"><h2 class="text-lg font-semibold">GCK</h2><p class="text-sm">Human apo and glucose-bound coordinates, NMR supplementary figures and tables, and separate variant activity and abundance scores.</p><p class="text-sm text-secondary">The primary CPMG fit is 509 ± 51 s⁻¹ and 16.5 ± 1.7% excited state at 313 K. Human solution SAXS and HDX are published. Public raw dispersion profiles, SAXS curves, and HDX runs were not located.</p><div class="mt-1 flex flex-wrap gap-x-4 gap-y-1 text-sm"><a target="_blank" rel="noopener noreferrer" class="text-text-link hover:text-text-link-strong hover:underline hover:decoration-dotted hover:decoration-text-link-strong underline-offset-2" data-streamdown="link" href="https://files.rcsb.org/download/1V4T.cif">1V4T apo mmCIF</a><a target="_blank" rel="noopener noreferrer" class="text-text-link hover:text-text-link-strong hover:underline hover:decoration-dotted hover:decoration-text-link-strong underline-offset-2" data-streamdown="link" href="https://files.rcsb.org/download/3IDH.cif">3IDH glucose-bound mmCIF</a><a target="_blank" rel="noopener noreferrer" class="text-text-link hover:text-text-link-strong hover:underline hover:decoration-dotted hover:decoration-text-link-strong underline-offset-2" data-streamdown="link" href="https://pmc-oa-opendata.s3.amazonaws.com/PMC4587531.1/PMC4587531.1.txt">2015 primary CPMG text</a></div></div><div class="border-b border-primary pb-3"><h2 class="text-lg font-semibold">AURKA</h2><p class="text-sm">Public single-molecule fluorescence and dwell-time archives, human kinase-domain SAXS, and raw and processed HDX-MS.</p><p class="text-sm text-secondary">Lake’s TR-FRET distances are in figures. The supplement contains numeric cooperativity factors for 24 inhibitors and the lifetime model. Per-well waveforms were not located.</p><div class="mt-1 flex flex-wrap gap-x-4 gap-y-1 text-sm"><a target="_blank" rel="noopener noreferrer" class="text-text-link hover:text-text-link-strong hover:underline hover:decoration-dotted hover:decoration-text-link-strong underline-offset-2" data-streamdown="link" href="https://pmc-oa-opendata.s3.amazonaws.com/PMC6304972.1/pnas.1811158115.sapp.pdf">Lake supplement PDF</a><a target="_blank" rel="noopener noreferrer" class="text-text-link hover:text-text-link-strong hover:underline hover:decoration-dotted hover:decoration-text-link-strong underline-offset-2" data-streamdown="link" href="https://zenodo.org/records/825693">Single-molecule data</a><a target="_blank" rel="noopener noreferrer" class="text-text-link hover:text-text-link-strong hover:underline hover:decoration-dotted hover:decoration-text-link-strong underline-offset-2" data-streamdown="link" href="https://zenodo.org/records/825752">Dwell-time data</a><a target="_blank" rel="noopener noreferrer" class="text-text-link hover:text-text-link-strong hover:underline hover:decoration-dotted hover:decoration-text-link-strong underline-offset-2" data-streamdown="link" href="https://zenodo.org/records/2555379">Unphosphorylated series</a></div></div><div class="border-b border-primary pb-3"><h2 class="text-lg font-semibold">ERK2</h2><p class="text-sm">Rat apo 0P and 2P HDX uptake and representative raw spectra, plus apo and inhibitor NMR spectra and chemical-shift tables.</p><p class="text-sm text-secondary">Rat TEY sites are T183/Y185. Human sites are T185/Y187. The public inhibitor workbook excludes SCH772984. Xiao’s 2014 CPMG and free ERK2 SAXS curves were not located as downloadable numeric data.</p><div class="mt-1 flex flex-wrap gap-x-4 gap-y-1 text-sm"><a target="_blank" rel="noopener noreferrer" class="text-text-link hover:text-text-link-strong hover:underline hover:decoration-dotted hover:decoration-text-link-strong underline-offset-2" data-streamdown="link" href="https://ftp.pride.ebi.ac.uk/pride/data/archive/2024/03/PXD048311/HDX_Uptakedata_Inhs1-17_ATG017_BVD523_VTX11e_GDC0994.xlsx">HDX uptake workbook</a><a target="_blank" rel="noopener noreferrer" class="text-text-link hover:text-text-link-strong hover:underline hover:decoration-dotted hover:decoration-text-link-strong underline-offset-2" data-streamdown="link" href="https://bmrbig.b
